<section class="visit-card card" aria-labelledby="visit-title">
    <div class="visit-info">
        <div class="section-icon" aria-hidden="true">01</div>
        <div>
            <p class="eyebrow">ТЕКУЩАЯ РАБОТА</p>
            <h2 id="visit-title">Приём</h2>
            <p id="status" class="status-text" aria-live="polite">
                Запись не начата
            </p>
        </div>
    </div>

    <div class="visit-actions">
        <button
            id="start-visit-button"
            class="button button-primary"
            type="button"
        >
            Начать приём
        </button>
        <button
            id="finish-visit-button"
            class="button button-danger-outline"
            type="button"
            disabled
        >
            Завершить приём
        </button>
    </div>
</section>
