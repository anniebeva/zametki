[project]
name = "zametki"
version = "0.1.0"
description = ""
authors = [
    {name = "anniebeva",email = "anniebeva@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard] (>=0.143.2,<0.144.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "faster-whisper (>=1.2.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "black (>=26.10.1,<27.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

